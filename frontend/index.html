<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cup 2026 — Ratings</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>World Cup 2026 — Ratings</h1>

  <div id="tabs" class="tabs"></div>

  <div class="controls">
    <span>Show:</span>
    <label><input type="radio" name="mode" value="all" checked> All teams</label>
    <label><input type="radio" name="mode" value="wc"> WC 2026 only</label>
    <span id="systemNote" class="note"></span>
  </div>

  <div class="grid">
    <div class="panel">
      <h2 id="tableTitle">Current ratings</h2>
      <div id="tableWrap"></div>
    </div>
    <div class="panel">
      <h2>Rating over time <span class="note">(yearly samples)</span></h2>
      <div id="chartWrap"><canvas id="chart"></canvas></div>
      <div id="chartNote" class="note"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
